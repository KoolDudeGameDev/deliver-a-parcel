<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<title>Deliver a Parcel</title>
<meta name="description" content="A blocky 3D delivery game in your browser. Start with a cardboard box, deliver food and parcels against the clock, dodge the dogs and build a mansion. Plays on phones too.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deliver-a-parcel.vercel.app/">
<meta property="og:title" content="Deliver a Parcel">
<meta property="og:description" content="Start with a cardboard box, deliver food and parcels against the clock, dodge the dogs and build a mansion. Free in your browser, on a computer or a phone.">
<meta property="og:image" content="https://deliver-a-parcel.vercel.app/assets/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A blocky rider on a motorbike outside a blue mansion, with a dog in the yard">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <div id="top">
    <div id="stats">
      <div id="cash">₱0</div>
      <div class="label">Stamina</div>
      <div class="bar" id="staminaBar"><i></i></div>
      <div class="label" id="ratingTag"></div>
      <div class="label" id="streakTag"></div>
      <div class="label" id="nightTag"></div>
      <div class="label" id="eventTag"></div>
      <div class="label" id="onlineTag"></div>
    </div>
    <canvas id="mini" aria-label="Minimap"></canvas>
  </div>
  <div id="job">
    <div id="nav"><span id="arrow">▲</span><span id="dist"></span></div>
    <div id="card">
      <div id="orderName"></div>
      <div id="timeLeft"></div>
      <div class="bar" id="timeBar"><i></i></div>
      <div class="label" id="freshLabel">Freshness</div>
      <div class="bar" id="freshBar"><i></i></div>
      <div id="more"></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="rotate">Turn your phone sideways for a wider view</div>
</div>
<div id="touch">
  <div id="leftZone"></div>
  <div id="base"><div id="knob"></div></div>
  <button class="btn" id="btnAction">ACTION</button>
  <button class="btn" id="btnJump">JUMP</button>
  <button class="btn" id="btnSprint">SPRINT</button>
</div>

<button id="btnMute"></button>

<dialog id="introBox" aria-labelledby="introTitle">
  <form method="dialog">
    <div class="brand"><img src="assets/icon-192.png" alt=""><h1 id="introTitle">Deliver a Parcel</h1></div>
    <p id="introNote"></p>
    <label for="nameInput">Your name</label>
    <input id="nameInput" maxlength="12" autocomplete="off" placeholder="Rider">
    <div id="looks"></div>
    <div class="row"><button id="btnPlay" autofocus>Play</button></div>
  </form>
</dialog>
<dialog id="boardBox">
  <h2>Order board</h2>
  <p id="boardNote"></p>
  <div id="boardList"></div>
  <h3>Today's goals</h3>
  <div id="goalList"></div>
  <div id="topRiders" hidden>
    <h3>Riders in this world</h3>
    <div id="topList"></div>
  </div>
  <form method="dialog"><div class="row"><button class="quiet">Close</button></div></form>
</dialog>
<dialog id="shopBox">
  <div class="shophead"><h2 id="shopTitle"></h2><span id="shopCash"></span></div>
  <div id="shopList"></div>
  <form method="dialog"><div class="row"><button class="quiet">Close</button></div></form>
</dialog>

<script type="module" src="src/main.js"></script>
</body>
</html>
