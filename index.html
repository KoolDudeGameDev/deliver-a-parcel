<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<title>Deliver a Parcel</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; color: #fff;
    font: 700 16px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    text-shadow: 0 2px 3px rgba(0,0,0,.55);
  }
  #top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #cash { font-size: 26px; }
  .label { font-size: 12px; margin: 5px 0 2px; }
  .bar { width: 130px; height: 10px; background: rgba(0,0,0,.45); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; transform-origin: left; background: #5ee07a; }
  #timeBar i { background: #ffd23f; }
  #staminaBar i { background: #6cc6ff; }
  #job {
    position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; visibility: hidden;
    padding: 6px 12px; border-radius: 12px; background: rgba(10,20,35,.55);
  }
  #nav { text-align: center; }
  #arrow { font-size: 34px; line-height: 1; display: block; color: #ffd23f; }
  #dist { font-size: 14px; white-space: nowrap; }
  #orderName { font-size: 15px; white-space: nowrap; }
  #more { max-width: 190px; margin-top: 4px; font-size: 12px; }
  #timeLeft { font-size: 22px; }
  #card .bar { width: 150px; }
  #mini {
    position: static; display: block; flex: none; width: 170px; height: 170px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.85); box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  @media (max-width: 760px), (max-height: 500px) { #mini { width: 110px; height: 110px; } }
  @media (max-width: 560px) { #job { top: calc(max(10px, env(safe-area-inset-top)) + 122px); } }
  #toast {
    position: fixed; left: 50%; top: 30%; transform: translateX(-50%);
    font-size: 24px; text-align: center; white-space: nowrap; opacity: 0; transition: opacity .25s;
  }
  #toast.show { opacity: 1; }
  #hint {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-size: 14px; text-align: center; width: min(90vw, 620px);
  }
  body.touch #hint { bottom: auto; top: 20%; width: calc(100vw - 280px); min-width: 180px; }
  #rotate { display: none; position: fixed; left: 0; right: 0; top: 14%; text-align: center; font-size: 15px; }
  @media (orientation: portrait) { body.touch #rotate { display: block; } }

  #touch { display: none; }
  body.touch #touch { display: block; }
  #leftZone { position: fixed; left: 0; top: 0; bottom: 0; width: 45%; touch-action: none; }
  #base {
    position: fixed; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px;
    border-radius: 50%; background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.5);
    pointer-events: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(255,255,255,.65);
  }
  .btn {
    position: fixed; display: grid; place-items: center; border: 3px solid rgba(255,255,255,.65);
    border-radius: 50%; color: #fff; background: rgba(0,0,0,.35); touch-action: none;
    font: inherit; font-size: 13px; padding: 0;
  }
  .btn.down { background: rgba(255,255,255,.4); }
  #btnAction { width: 84px; height: 84px; right: calc(16px + env(safe-area-inset-right)); bottom: calc(92px + env(safe-area-inset-bottom)); }
  #btnAction.ready { background: #2fae57; border-color: #fff; }
  #btnJump { width: 72px; height: 72px; right: calc(16px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); }
  #btnSprint { width: 72px; height: 72px; right: calc(104px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); }

  dialog {
    width: min(92vw, 380px); max-height: 92dvh; overflow: auto; padding: 16px 18px; border: 0; border-radius: 16px;
    background: #16202e; color: #fff; font: inherit; touch-action: pan-y; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  dialog::backdrop { background: rgba(5,10,20,.55); }
  dialog h2 { margin: 0 0 8px; font-size: 20px; }
  dialog h3 { margin: 10px 0 4px; font-size: 15px; color: #ffd23f; }
  dialog p { margin: 0 0 10px; font-size: 14px; font-weight: 500; color: #c3ccd8; }
  dialog button {
    min-height: 44px; padding: 8px 14px; border: 0; border-radius: 10px; font: inherit;
    background: #2f7de0; color: #fff; cursor: pointer;
  }
  dialog button:disabled { background: #3a4656; color: #aab4c0; cursor: default; }
  dialog button.quiet { background: #2c3848; }
  #nameInput {
    width: 100%; margin: 6px 0 14px; padding: 10px; border: 2px solid #3a4656; border-radius: 10px;
    background: #0e1620; color: #fff; font: inherit; user-select: text; -webkit-user-select: text;
  }
  .row { display: flex; justify-content: flex-end; gap: 10px; }
  .veh {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
    padding: 7px 0; border-top: 1px solid #2c3848;
  }
  .veh span { font-size: 13px; font-weight: 500; color: #aab4c0; }
  .veh button { grid-column: 2; grid-row: 1 / 3; min-width: 104px; }
  @media (max-height: 420px) {
    dialog { width: min(96vw, 720px); padding: 10px 16px; }
    dialog h2 { margin-bottom: 2px; }
    dialog p { margin-bottom: 4px; }
    dialog h3 { margin-top: 0; break-after: avoid; }
    #garageList { columns: 2; column-gap: 24px; }
    .veh { padding: 2px 0; break-inside: avoid; }
    .veh button { min-width: 84px; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <div id="top">
    <div>
      <div id="cash">₱0</div>
      <div class="label">Stamina</div>
      <div class="bar" id="staminaBar"><i></i></div>
    </div>
    <canvas id="mini" aria-label="Minimap"></canvas>
  </div>
  <div id="job">
    <div id="nav"><span id="arrow">▲</span><span id="dist"></span></div>
    <div id="card">
      <div id="orderName"></div>
      <div id="timeLeft"></div>
      <div class="bar" id="timeBar"><i></i></div>
      <div class="label" id="freshLabel">Freshness</div>
      <div class="bar" id="freshBar"><i></i></div>
      <div id="more"></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="rotate">Turn your phone sideways for a wider view</div>
</div>
<div id="touch">
  <div id="leftZone"></div>
  <div id="base"><div id="knob"></div></div>
  <button class="btn" id="btnAction">ACTION</button>
  <button class="btn" id="btnJump">JUMP</button>
  <button class="btn" id="btnSprint">SPRINT</button>
</div>

<dialog id="claimBox">
  <form method="dialog">
    <h2>Welcome, rider!</h2>
    <p>You start with a cardboard box somewhere on the map. Deliver orders, earn cash and turn it into a mansion.</p>
    <label for="nameInput">Your name</label>
    <input id="nameInput" maxlength="12" autocomplete="off">
    <div class="row"><button value="ok">Start</button></div>
  </form>
</dialog>
<dialog id="garageBox">
  <h2>Your home</h2>
  <p id="garageCash"></p>
  <div id="garageList"></div>
  <form method="dialog"><div class="row"><button class="quiet">Close</button></div></form>
</dialog>

<script type="module">
import * as THREE from 'three';

// Tuning. Everything worth playing with lives here.
const RUN = 6, SPRINT = 9.5, PARCEL_SLOW = 0.75, JUMP_V = 9, GRAVITY = 26;
const FOOD_TIME = 8, PARCEL_TIME = 14, FOOD_PAY = 30, PARCEL_PAY = 25, FAR_PAY = .4;
const DOG_TYPES = {
  tiny:   { scale: .45, speed: 8.2, knock: 3,  stun: .05, damage: 5,  color: 0xe8d0a9, name: 'Tiny dog' },
  small:  { scale: .65, speed: 7.5, knock: 5,  stun: .15, damage: 10, color: 0xc9915a, name: 'Small dog' },
  medium: { scale: 1,   speed: 6.3, knock: 8,  stun: .35, damage: 18, color: 0x9a6a45, name: 'Medium dog' },
  big:    { scale: 1.35, speed: 5.4, knock: 13, stun: .7, damage: 30, color: 0x5f5f6b, name: 'Big dog' },
  giant:  { scale: 1.9, speed: 4.6, knock: 19, stun: 1.1, damage: 45, color: 0x2f2f38, name: 'Giant dog' },
};

function wheel(r, w, z, g, x = 0) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 14).rotateZ(Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x222222 }));
  m.position.set(x, r, z);
  m.castShadow = !isTouch;
  g.add(m);
}

function sidecar(g) {
  box(.95, .5, 1.6, 0xd6402b, 1.25, .62, -.05, g);
  box(.95, .32, .5, 0xf2f2ee, 1.25, .98, .45, g);
  box(.6, .4, .6, 0xb98a56, 1.25, 1.05, -.3, g);
  box(1, .08, .08, 0x333333, .7, .5, .4, g);
  box(1, .08, .08, 0x333333, .7, .5, -.5, g);
  wheel(.32, .16, 0, g, 1.25);
}

// Bought in this order. A new vehicle is one more row here. Each part is levels of the same
// upgrade, one price per level, and what every level adds to speed, accel or carry.
const VEHICLES = {
  skateboard: {
    name: 'Skateboard', price: 150, speed: 9, accel: 6,
    seat: lv => .3 + lv.wheels * .1,
    parts: {
      wheels: { name: 'Bigger wheels', prices: [60, 160, 360], speed: 1 },
      deck: { name: 'Bigger deck', prices: [120, 320], accel: 2 },
      crate: { name: 'Milk crate', prices: [260], carry: 1 },
    },
    model(g, lv) {
      const r = .09 + lv.wheels * .05, len = 1.7 + lv.deck * .55, wide = .7 + lv.deck * .16;
      box(wide, .08, len, 0xd6402b, 0, r * 2 + .06, 0, g);
      for (const z of [-len * .32, len * .32]) {
        for (const x of [-wide * .42, wide * .42]) wheel(r, .16, z, g, x);
      }
      if (lv.crate) box(.6, .5, .6, 0x3f7fd6, 0, r * 2 + .35, -len * .36, g);
    },
  },
  bicycle: {
    name: 'Bicycle', price: 500, speed: 12, accel: 5,
    seat: lv => .8 + lv.tires * .16,
    parts: {
      tires: { name: 'Bigger tires', prices: [150, 400, 800], speed: 1 },
      basket: { name: 'Front basket', prices: [300], carry: 1 },
      sidecar: { name: 'Sidecar', prices: [700], carry: 2 },
    },
    model(g, lv) {
      const r = .48 + lv.tires * .08, lift = lv.tires * .16;
      for (const z of [-.85, .85]) wheel(r, .1 + lv.tires * .05, z, g);
      box(.12, .12, 1.6, 0x2fae57, 0, .9 + lift, 0, g);
      box(.1, .6, .1, 0x2fae57, 0, 1.15 + lift, .7, g);
      box(.95, .1, .1, 0x222222, 0, 1.45 + lift, .7, g);
      box(.34, .1, .5, 0x222222, 0, 1.02 + lift, -.35, g);
      if (lv.basket) box(.65, .35, .5, 0x8a6a3a, 0, 1.25 + lift, 1.05, g);
      if (lv.sidecar) sidecar(g);
    },
  },
  moped: {
    name: 'Moped', price: 1500, speed: 17, accel: 3.5,
    seat: lv => .75 + lv.tires * .12,
    parts: {
      engine: { name: 'Bigger engine', prices: [500, 1100, 2200], speed: 1.5 },
      tires: { name: 'Wider tires', prices: [400, 900], accel: 1 },
      topBox: { name: 'Top box', prices: [800], carry: 1 },
      sidecar: { name: 'Sidecar', prices: [1600], carry: 2 },
    },
    model(g, lv) {
      const r = .38 + lv.tires * .06, lift = lv.tires * .12;
      for (const z of [-.8, .85]) wheel(r, .24 + lv.tires * .08, z, g);
      box(.6, .4, 1.7, 0xe0443a, 0, .62 + lift, 0, g);
      box(.62, .95, .16, 0xe0443a, 0, 1.05 + lift, .72, g);
      box(.95, .1, .1, 0x222222, 0, 1.55 + lift, .68, g);
      box(.52, .2, .9, 0x222222, 0, .93 + lift, -.2, g);
      for (let i = 0; i < lv.engine; i++) box(.14, .14, .8, 0xb8bec6, .34 - i * .34, .32 + lift, -.75, g);
      if (lv.topBox) box(.75, .6, .6, 0xffd23f, 0, 1.3 + lift, -.8, g);
      if (lv.sidecar) sidecar(g);
    },
  },
};

function pitchedRoof(w, h, d, color, y, g, x = 0) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(Math.SQRT1_2, 1, 4).rotateY(Math.PI / 4), new THREE.MeshLambertMaterial({ color }));
  m.scale.set(w, h, d);
  m.position.set(x, y + h / 2, 0);
  m.castShadow = !isTouch;
  g.add(m);
}

// Every player starts on the first row. size is half the footprint, for the collider.
const HOMES = [
  {
    name: 'Cardboard box', price: 0, bonus: 0, size: [2, 1.8],
    model(g) {
      box(3.6, 2.6, 3.2, 0xb98a56, 0, 1.3, 0, g);
      box(3.64, .2, .5, 0xd9c79a, 0, 2.5, 0, g);
      box(3.6, .1, 1.2, 0xa87b4a, 0, 2.75, 1.85, g).rotation.x = -.5;
      box(1.3, 1.7, .06, 0x3a2a1c, 0, .85, 1.62, g);
    },
  },
  {
    name: 'Wooden shack', price: 300, bonus: .05, size: [3.2, 2.7],
    model(g) {
      box(6, 3.2, 5, 0x9a7350, 0, 1.6, 0, g);
      box(6.9, .3, 5.9, 0x8f9aa6, 0, 3.35, 0, g);
      box(1.3, 2.2, .08, 0x4a3323, -1, 1.1, 2.52, g);
      box(1.4, 1, .08, 0x7fa6c9, 1.5, 1.8, 2.52, g);
    },
  },
  {
    name: 'Bungalow', price: 1000, bonus: .1, size: [4.2, 3.4],
    model(g) {
      box(8, 3.6, 6.5, 0xe8dcc4, 0, 1.8, 0, g);
      pitchedRoof(9.4, 3, 7.9, 0x8a4b38, 3.6, g);
      box(1.5, 2.5, .08, 0x5a3a28, 0, 1.25, 3.27, g);
      for (const x of [-2.5, 2.5]) box(1.6, 1.2, .08, 0x7fa6c9, x, 2, 3.27, g);
    },
  },
  {
    name: 'Two-storey house', price: 3000, bonus: .15, size: [7.5, 4],
    model(g) {
      box(10, 6.6, 7.5, 0xd8e0ea, -2, 3.3, 0, g);
      pitchedRoof(11.4, 3.2, 8.9, 0x56606e, 6.6, g, -2);
      box(1.6, 2.6, .08, 0x5a3a28, -2, 1.3, 3.77, g);
      for (const x of [-5, 1]) {
        for (const y of [2, 5]) box(1.7, 1.3, .08, 0x7fa6c9, x, y, 3.77, g);
      }
      box(1.7, 1.3, .08, 0x7fa6c9, -2, 5, 3.77, g);
      box(5, 3.6, 7, 0xc8d0da, 5.5, 1.8, 0, g);
      box(5.6, .3, 7.6, 0x56606e, 5.5, 3.75, 0, g);
      box(4, 2.8, .08, 0x6a6f78, 5.5, 1.4, 3.52, g);
    },
  },
  {
    name: 'Mansion', price: 9000, bonus: .25, size: [11, 4.2],
    model(g) {
      box(10, 8, 8, 0xf4efe4, 0, 4, 0, g);
      pitchedRoof(11.6, 3.4, 9.6, 0x2f3b52, 8, g);
      for (const s of [-1, 1]) {
        box(6, 5, 7.4, 0xece6d8, s * 8, 2.5, 0, g);
        pitchedRoof(7.4, 2.4, 8.6, 0x2f3b52, 5, g, s * 8);
        for (const x of [-1.6, 1.6]) box(1.6, 1.6, .08, 0x7fa6c9, s * 8 + x, 2.8, 3.74, g);
      }
      for (const x of [-3.6, -1.2, 1.2, 3.6]) box(.5, 6.4, .5, 0xffffff, x, 3.2, 4.3, g);
      box(8.6, .5, 1.6, 0xffffff, 0, 6.5, 3.9, g);
      box(2, 3, .08, 0x6b3e2e, 0, 1.5, 4.04, g);
      box(1.4, .14, .14, 0xffd23f, 0, 7.1, 4.08, g);
    },
  },
];
const VEHICLE_KEYS = Object.keys(VEHICLES);

const isTouch = matchMedia('(pointer: coarse)').matches || new URLSearchParams(location.search).has('touch');
document.body.classList.toggle('touch', isTouch);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---------- Renderer and scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = !isTouch;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8fd3ff, 130, 300);
const camera = new THREE.PerspectiveCamera(60, 1, .3, 440);

const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x6f8f5e, 1.3);
const sun = new THREE.DirectionalLight(0xfff0da, 2.4);
sun.castShadow = !isTouch;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.normalBias = .06;
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 240 });
scene.add(hemi, sun, sun.target);

const skyUniforms = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() } };
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(400, 24, 12), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
  vertexShader: `varying vec3 d;
    void main() { d = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform vec3 top, hor; varying vec3 d;
    void main() {
      gl_FragColor = vec4(mix(hor, top, pow(clamp(normalize(d).y, 0., 1.), .55)), 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
skyDome.renderOrder = -1;
scene.add(skyDome);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- World helpers ----------
const colliders = [], solids = [];

function box(w, h, d, color, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = !isTouch;
  parent.add(m);
  return m;
}

// Everything that never moves goes through these lists and becomes a few InstancedMeshes,
// so the whole map costs a handful of draw calls instead of one per box.
const blocks = [], walls = [], roofs = [], bulbs = [];
const block = (w, h, d, color, x, y, z) => blocks.push({ w, h, d, color, x, y, z });

function instanced(list, geometry, material, shadows = true) {
  const m = new THREE.InstancedMesh(geometry, material, list.length), o = new THREE.Object3D(), c = new THREE.Color();
  list.forEach((b, i) => {
    o.position.set(b.x, b.y, b.z);
    o.scale.set(b.w, b.h, b.d);
    o.updateMatrix();
    m.setMatrixAt(i, o.matrix);
    m.setColorAt(i, c.set(b.color));
  });
  m.castShadow = m.receiveShadow = shadows && !isTouch;
  scene.add(m);
  return m;
}

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

function speckle(x, w, h, count, colors) {
  for (let i = 0; i < count; i++) {
    x.fillStyle = colors[i % colors.length];
    x.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
}

function addCollider(x, z, halfX, halfZ) {
  colliders.push({ x0: x - halfX, x1: x + halfX, z0: z - halfZ, z1: z + halfZ });
}

// Pushes a circle out of every box collider. Axis-aligned only, which is all this map needs.
function resolve(p, r) {
  for (const c of colliders) {
    const nx = clamp(p.x, c.x0, c.x1), nz = clamp(p.z, c.z0, c.z1);
    const dx = p.x - nx, dz = p.z - nz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      p.x = nx + dx / d * r;
      p.z = nz + dz / d * r;
    } else {
      const l = p.x - c.x0, ri = c.x1 - p.x, t = p.z - c.z0, b = c.z1 - p.z, m = Math.min(l, ri, t, b);
      if (m === l) p.x = c.x0 - r;
      else if (m === ri) p.x = c.x1 + r;
      else if (m === t) p.z = c.z0 - r;
      else p.z = c.z1 + r;
    }
  }
}

function textTexture(lines, bg, fg) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 256, 128);
  x.fillStyle = fg; x.font = 'bold 44px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach((l, i) => x.fillText(l, 128, 64 + (i - (lines.length - 1) / 2) * 50, 240));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function sign(lines, bg, fg, w, h, x, y, z, rotY) {
  // Two planes back to back, so the text isn't mirrored from behind.
  const material = new THREE.MeshBasicMaterial({ map: textTexture(lines, bg, fg), toneMapped: false });
  for (const turn of [0, Math.PI]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
    m.position.set(x, y, z);
    m.rotation.y = rotY + turn;
    scene.add(m);
  }
  return material;
}

function buildHouse(h) {
  // Local coords: v points from the house towards the road, u runs across the yard.
  const px = h.dz, pz = -h.dx;
  const at = (u, v) => [h.x + h.dx * v + px * u, h.z + h.dz * v + pz * u];
  const face = Math.atan2(h.dx, h.dz);
  h.yard = { x0: h.x - YARD, x1: h.x + YARD, z0: h.z - YARD, z1: h.z + YARD };

  const fence = (u0, v0, u1, v1) => {
    const [ax, az] = at(u0, v0), [bx, bz] = at(u1, v1);
    const w = Math.max(Math.abs(bx - ax), .4), d = Math.max(Math.abs(bz - az), .4);
    const mx = (ax + bx) / 2, mz = (az + bz) / 2;
    block(w, 2, d, 0xf3efe4, mx, 1, mz);
    addCollider(mx, mz, w / 2, d / 2);
  };
  fence(-YARD, -YARD, YARD, -YARD);
  fence(-YARD, -YARD, -YARD, YARD);
  fence(YARD, -YARD, YARD, YARD);
  fence(-YARD, YARD, -GATE, YARD);
  fence(GATE, YARD, YARD, YARD);

  // Gate arch, so the way in reads from the road.
  for (const s of [-1, 1]) {
    const [x, z] = at(s * GATE, YARD);
    block(.6, 4, .6, h.color, x, 2, z);
  }
  const [gx, gz] = at(0, YARD);
  block(Math.abs(h.dz) * (GATE * 2 + .6) + .6 * Math.abs(h.dx), .5, Math.abs(h.dx) * (GATE * 2 + .6) + .6 * Math.abs(h.dz), h.color, gx, 4, gz);

  // House body, roof, door.
  const [hx, hz] = at(0, -YARD + 6);
  const bw = Math.abs(h.dz) * 14 + Math.abs(h.dx) * 9, bd = Math.abs(h.dx) * 14 + Math.abs(h.dz) * 9;
  walls.push({ w: bw, h: 6, d: bd, color: h.color, x: hx, y: 3, z: hz });
  addCollider(hx, hz, bw / 2, bd / 2);
  roofs.push({ w: bw + 1.4, h: 4, d: bd + 1.4, color: ROOF_COLORS[roofs.length % ROOF_COLORS.length], x: hx, y: 8, z: hz });
  const [dx, dz] = at(0, -YARD + 10.6);
  block(Math.abs(h.dz) * 2 + Math.abs(h.dx) * .3, 3.4, Math.abs(h.dx) * 2 + Math.abs(h.dz) * .3, 0x5a3a28, dx, 1.7, dz);

  const [sx, sz] = at(0, -YARD + 12.2);
  h.step = new THREE.Vector3(sx, 0, sz);
  block(Math.abs(h.dz) * 4 + Math.abs(h.dx) * 2.2, .12, Math.abs(h.dx) * 4 + Math.abs(h.dz) * 2.2, 0xbdb8aa, sx, .08, sz);

  // Path from the road, through the gate, up to the doorstep.
  const [p0x, p0z] = at(0, -YARD + 13), [p1x, p1z] = at(0, YARD + 10);
  block(Math.abs(h.dz) * 5 + Math.abs(p1x - p0x), .06, Math.abs(h.dx) * 5 + Math.abs(p1z - p0z), PATH, (p0x + p1x) / 2, .02, (p0z + p1z) / 2);

  if (h.dog) {
    const [ax, az] = at(5.5, YARD + 1.2);
    block(.25, 2.3, .25, 0x7a5a3c, ax, 1.15, az);
    sign(['BEWARE', 'OF DOG'], '#ffd23f', '#222', 3, 1.5, ax, 2.7, az, face);
  }
}

// ---------- Time of day ----------
const DAY_LENGTH = 360, SUN_INTENSITY = 2.1, MOON_INTENSITY = .35;
const DAY_TOP = new THREE.Color(0x2f86e8), DAY_HOR = new THREE.Color(0xa9dcff), DUSK = new THREE.Color(0xff9a5c);
const NIGHT_TOP = new THREE.Color(0x0b1433), NIGHT_HOR = new THREE.Color(0x2a3a5e);
const SUN_COLOR = new THREE.Color(0xfff0da), MOON_COLOR = new THREE.Color(0x9db8ff);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const sunDir = new THREE.Vector3();
let dayTime = .36;

function updateDay(dt) {
  dayTime = (dayTime + dt / DAY_LENGTH) % 1;
  // height is 1 at noon and -1 at midnight. The light itself stays above the horizon: at night
  // it's the moon, so it never has to jump across the sky.
  const height = Math.sin((dayTime - .25) * Math.PI * 2);
  const day = smooth(-.1, .3, height), dusk = clamp(1 - Math.abs(height - .05) / .3, 0, 1);
  skyUniforms.top.value.copy(NIGHT_TOP).lerp(DAY_TOP, day);
  skyUniforms.hor.value.copy(NIGHT_HOR).lerp(DAY_HOR, day).lerp(DUSK, dusk * .7);
  scene.fog.color.copy(skyUniforms.hor.value);
  hemi.intensity = .5 + .85 * day;
  sun.intensity = MOON_INTENSITY + (SUN_INTENSITY - MOON_INTENSITY) * day;
  sun.color.copy(MOON_COLOR).lerp(SUN_COLOR, day).lerp(DUSK, dusk * .55);
  const az = dayTime * Math.PI * 2;
  sunDir.set(Math.cos(az) * .8, Math.max(.45, height), Math.sin(az) * .8).normalize();

  const night = 1 - smooth(.0, .25, height);
  wallMaterial.emissiveIntensity = night * 1.1;
  bulbMaterial.color.setRGB(.25 + night * .75, .25 + night * .7, .25 + night * .45);
  glowMaterial.opacity = night * .9;
  poolMaterial.opacity = night * .4;
  lampGlow.visible = lampPools.visible = night > .01;
  cloudMaterial.color.setRGB(.2 + .8 * day, .23 + .77 * day, .32 + .68 * day).lerp(DUSK, dusk * .35);
  cloudMesh.position.x = Math.sin(performance.now() / 90000) * 120;
  skyDome.position.copy(camera.position);
}

}

function buildDog(h) {
  const t = DOG_TYPES[h.dog], g = new THREE.Group(), c = t.color;
  box(.6, .6, 1.4, c, 0, .75, 0, g);

  const legs = [[-.2, .5], [.2, .5], [-.2, -.5], [.2, -.5]].map(([x, z]) => {

  });

  const pos = new THREE.Vector3(h.x, 0, h.z).addScaledVector(new THREE.Vector3(h.dx, 0, h.dz), 5);
  return { ...t, house: h, group: g, legs, tail, mark, pos, target: pos.clone(), wait: 0, cd: 0, alert: false, phase: 0, r: .55 * t.scale };
}
const dogs = HOUSES.filter(h => h.dog).map(buildDog);
const inYard = (p, y) => p.x > y.x0 && p.x < y.x1 && p.z > y.z0 && p.z < y.z1;

function bite(d) {
  const a = Math.atan2(player.pos.x - d.pos.x, player.pos.z - d.pos.z);
  player.kx = Math.sin(a) * d.knock;
  player.kz = Math.cos(a) * d.knock;
  player.vy = Math.max(player.vy, 4);
  player.stun = d.stun;
  shake = .35;
  d.cd = 1.2;
  for (const o of orders) o.fresh = Math.max(0, o.fresh - d.damage);
  toast(orders.length ? `${d.name} bit you! -${d.damage}%` : `${d.name} bit you!`);
}

function updateDog(d, dt) {
  const y = d.house.yard, chasing = inYard(player.pos, y);
  // Too far off to make out, so not worth a dozen draw calls each.
  d.group.visible = Math.hypot(player.pos.x - d.pos.x, player.pos.z - d.pos.z) < 130;
  if (chasing && !d.alert) toast('WOOF! Run!');
  d.alert = chasing;
  d.mark.visible = chasing;
  d.cd -= dt;

  let speed = 1.6;
  if (chasing) {
    d.target.copy(player.pos);
    speed = d.speed;
  } else if ((d.wait -= dt) < 0) {
    d.wait = 1 + Math.random() * 3;
    d.target.set(d.house.x + (Math.random() - .5) * 20, 0, d.house.z + (Math.random() - .5) * 20);
    d.target.addScaledVector(new THREE.Vector3(d.house.dx, 0, d.house.dz), 4);
  }

  const dx = d.target.x - d.pos.x, dz = d.target.z - d.pos.z, dist = Math.hypot(dx, dz);
  const moving = dist > .6;
  if (moving) {
    d.pos.x += dx / dist * speed * dt;
    d.pos.z += dz / dist * speed * dt;
    d.group.rotation.y = Math.atan2(dx, dz);
    d.phase += speed * dt * 2.4;
  }
  resolve(d.pos, d.r);
  // Staying inside the yard rect is what makes a dog give up at the fence.
  d.pos.x = clamp(d.pos.x, y.x0 + .8, y.x1 - .8);
  d.pos.z = clamp(d.pos.z, y.z0 + .8, y.z1 - .8);

  const swing = moving ? Math.sin(d.phase) * .9 : 0;
  d.legs.forEach((l, i) => l.rotation.x = i % 2 ? -swing : swing);
  d.tail.rotation.y = Math.sin(performance.now() / (chasing ? 50 : 160)) * .6;
  d.group.position.copy(d.pos);
  d.group.position.y = chasing ? Math.abs(Math.sin(d.phase)) * .25 : 0;

  const touching = Math.hypot(player.pos.x - d.pos.x, player.pos.z - d.pos.z) < 1.1 + d.r;
  // The bigger the dog, the higher you have to jump to clear it.
  if (chasing && touching && d.cd <= 0 && player.pos.y < .5 + d.scale * .25) bite(d);
}

// ---------- Save ----------
// Lives in this browser for now. Anything unexpected in it just means a new game.
const SAVE_KEY = 'delivery-game-save-v1';
function cleanParts(saved) {
  const parts = {};
  for (const k of VEHICLE_KEYS) {
    parts[k] = {};
    for (const [p, def] of Object.entries(VEHICLES[k].parts)) {
      const n = saved?.[k]?.[p];
      parts[k][p] = Number.isInteger(n) ? clamp(n, 0, def.prices.length) : 0;
    }
  }
  return parts;
}

function loadSave() {
  const fresh = { name: '', slot: null, cash: 0, delivered: 0, owned: [], equipped: null, homeLevel: 0, parts: cleanParts() };
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!s || typeof s !== 'object') return fresh;
    const owned = VEHICLE_KEYS.filter(k => Array.isArray(s.owned) && s.owned.includes(k));
    return {
      name: typeof s.name === 'string' ? s.name.slice(0, 12) : '',
      slot: Number.isInteger(s.slot) && LOTS[s.slot] ? s.slot : null,
      cash: Number.isFinite(s.cash) && s.cash > 0 ? Math.floor(s.cash) : 0,
      delivered: Number.isFinite(s.delivered) && s.delivered > 0 ? Math.floor(s.delivered) : 0,
      owned,
      equipped: owned.includes(s.equipped) ? s.equipped : null,
      homeLevel: HOMES[s.homeLevel] ? s.homeLevel : 0,
      parts: cleanParts(s.parts),
    };
  } catch {
    return fresh;
  }
}
const save = loadSave();
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch {
    // Private browsing can refuse storage. The game still plays, it just won't be kept.
  }
}

// ---------- Orders ----------
const orders = [];
let lastHouse = null;
const beamGeometry = new THREE.CylinderGeometry(1.4, 1.4, 16, 16, 1, true);
const beamMaterial = new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: .35, side: THREE.DoubleSide, depthWrite: false });
const beams = [0, 1, 2, 3].map(() => {
  const b = new THREE.Mesh(beamGeometry, beamMaterial);
  b.visible = false;
  scene.add(b);
  return b;
});

const nearHub = () => Math.hypot(player.pos.x - HUB.x, player.pos.z - HUB.z) < HUB_R;
const capacity = () => rideStats(save.equipped).carry;
const nearestOrder = () => orders.reduce((best, o) => {
  const d = Math.hypot(player.pos.x - o.house.step.x, player.pos.z - o.house.step.z);
  return !best || d < best.d ? { o, d } : best;
}, null)?.o;

function syncCarry() {
  const parcel = orders.some(o => !o.food);
  carryParcel.visible = parcel;
  carryFood.visible = orders.some(o => o.food);
  carryFood.position.y = parcel ? 2.22 : 1.75;
  hubRing.visible = orders.length < capacity();
}

function takeOrder() {
  if (orders.length >= capacity() || !nearHub()) return;
  // Dog yards come up about twice as often: they're the fun part.
  const pool = HOUSES.flatMap(h => (h.dog ? [h, h] : [h])).filter(h => h !== lastHouse && !orders.some(o => o.house === h));
  const house = pool[Math.floor(Math.random() * pool.length)];
  // Time is what a runner needs to get there plus a margin, so faster vehicles keep more of it as tip.
  const food = Math.random() < .6, dist = Math.hypot(house.step.x - HUB.x, house.step.z - HUB.z);
  const max = food ? FOOD_TIME + dist / RUN * 1.25 : PARCEL_TIME + dist / RUN * 1.6;
  const pay = (food ? FOOD_PAY : PARCEL_PAY) + Math.round(Math.max(0, dist - 60) * FAR_PAY);
  const beam = beams.find(b => !b.visible);
  beam.position.set(house.step.x, 8, house.step.z);
  beam.visible = true;
  orders.push({ food, house, max, left: max, fresh: 100, pay, beam });
  lastHouse = house;
  syncCarry();
  toast(food ? 'Hot food! Go go go!' : 'Parcel: heavy, so you move slower');
}

function endOrder(o) {
  orders.splice(orders.indexOf(o), 1);
  o.beam.visible = false;
  syncCarry();
}

function updateOrder(dt) {
  for (const o of [...orders]) {
    o.left -= dt;
    if (o.left <= 0) {
      toast('Too late! Order cancelled');
      endOrder(o);
    } else if (Math.hypot(player.pos.x - o.house.step.x, player.pos.z - o.house.step.z) < 2.4) {
      const tip = Math.round(o.pay * 1.5 * (o.left / o.max) * (o.fresh / 100));
      const total = Math.round((o.pay + tip) * (1 + HOMES[save.homeLevel].bonus));
      save.cash += total;
      save.delivered++;
      saveGame();
      toast(`+₱${total} (tip ₱${tip})`);
      endOrder(o);
    }
  }
}

function buyHome() {
  const next = HOMES[save.homeLevel + 1];
  if (!next || save.cash < next.price) return false;
  save.cash -= next.price;
  save.homeLevel++;
  saveGame();
  showHome();
  toast(`${next.name} built!`);
  return true;
}

const nextVehicle = () => VEHICLE_KEYS.find(k => !save.owned.includes(k));

function rideStats(key) {
  if (!key) return { name: 'Running', speed: RUN, accel: 30, carry: 1, seat: 0 };
  const v = VEHICLES[key], lv = save.parts[key], stats = { name: v.name, speed: v.speed, accel: v.accel, carry: 1, seat: v.seat(lv) };
  for (const [p, def] of Object.entries(v.parts)) {
    for (const stat of ['speed', 'accel', 'carry']) stats[stat] += (def[stat] || 0) * lv[p];
  }
  return stats;
}

function buyVehicle(key) {
  const v = VEHICLES[key];
  if (key !== nextVehicle() || save.cash < v.price) return false;
  save.cash -= v.price;
  save.owned.push(key);
  setVehicle(key);
  saveGame();
  toast(`${v.name} bought!`);
  return true;
}

function buyPart(key, part) {
  const lv = save.parts[key], price = VEHICLES[key].parts[part].prices[lv[part]];
  if (!save.owned.includes(key) || price === undefined || save.cash < price) return false;
  save.cash -= price;
  lv[part]++;
  if (save.equipped === key) setVehicle(key);
  saveGame();
  toast(`${VEHICLES[key].parts[part].name} fitted!`);
  return true;
}

// The cheapest next thing you could buy right now, for the nudge in the hint line.
function affordable() {
  const v = VEHICLES[nextVehicle()], home = HOMES[save.homeLevel + 1], ride = VEHICLES[save.equipped];
  const options = [v, home].filter(Boolean);
  for (const [p, def] of Object.entries(ride?.parts || {})) {
    const price = def.prices[save.parts[save.equipped][p]];
    if (price !== undefined) options.push({ name: def.name, price });
  }
  return options.filter(o => o.price <= save.cash).sort((a, b) => a.price - b.price)[0];
}

function renderGarage() {
  $('garageCash').textContent = `You have ₱${save.cash}`;
  const heading = text => {
    const h = document.createElement('h3');
    h.textContent = text;
    return h;
  };
  const row = (name, sub, label, enabled, onClick) => {
    const r = document.createElement('div'), b = document.createElement('button');
    r.className = 'veh';
    r.append(document.createElement('b'), document.createElement('span'), b);
    r.children[0].textContent = name;
    r.children[1].textContent = sub;
    b.textContent = label;
    b.disabled = !enabled;
    b.onclick = () => { onClick(); renderGarage(); };
    return r;
  };
  const use = key => { setVehicle(key); saveGame(); };
  const rideLine = key => { const r = rideStats(key); return `${r.speed} m/s · carries ${r.carry}`; };
  const home = HOMES[save.homeLevel], nextHome = HOMES[save.homeLevel + 1];
  const list = [
    heading('House'),
    row(home.name, `+${Math.round(home.bonus * 100)}% pay${nextHome ? ` · next: ${nextHome.name}` : ''}`,
      nextHome ? `₱${nextHome.price}` : 'Max', nextHome && save.cash >= nextHome.price, buyHome),
    heading('Ride'),
    row('Running', rideLine(null), save.equipped ? 'Use' : 'Using', !!save.equipped, () => use(null)),
    ...VEHICLE_KEYS.map(k => {
      const v = VEHICLES[k];
      if (save.owned.includes(k)) return row(v.name, rideLine(k), save.equipped === k ? 'Using' : 'Use', save.equipped !== k, () => use(k));
      const line = `${v.speed} m/s · carries 1`;
      if (k === nextVehicle()) return row(v.name, line, `₱${v.price}`, save.cash >= v.price, () => buyVehicle(k));
      return row(v.name, line, 'Locked', false);
    }),
  ];
  const k = save.equipped;
  if (k) {
    list.push(heading(`${VEHICLES[k].name} upgrades`));
    for (const [p, def] of Object.entries(VEHICLES[k].parts)) {
      const level = save.parts[k][p], price = def.prices[level];
      const gives = def.carry ? `+${def.carry} order${def.carry > 1 ? 's' : ''}` : def.speed ? `+${def.speed} m/s` : `+${def.accel} grip`;
      list.push(row(def.name, `Level ${level} of ${def.prices.length} · ${gives}`,
        price === undefined ? 'Max' : `₱${price}`, price !== undefined && save.cash >= price, () => buyPart(k, p)));
    }
  }
  $('garageList').replaceChildren(...list);
}

function openGarage() {
  for (const k in keys) keys[k] = false;

// What the action button would do right here.
function actionSpot() {
  if (orders.length < capacity() && nearHub()) return 'ORDER';
  if (myLot() && nearSpot(myLot().step, 3.6)) return 'HOME';
  return null;
}

function action() {
  const spot = actionSpot();
  if (spot === 'ORDER') takeOrder();
  else if (spot === 'HOME') openGarage();
}

// A vehicle rides under the player, or waits at the gate while they walk a yard.
let rideGroup = null, rideNow = null, parked = false;

function setVehicle(key) {
  rideGroup?.removeFromParent();
  save.equipped = key;
  parked = false;
  rideGroup = rideNow = null;
  if (key) {
    rideNow = rideStats(key);
    rideGroup = new THREE.Group();
    VEHICLES[key].model(rideGroup, save.parts[key]);
    mountVehicle();

}

function mountVehicle() {
  parked = false;
  body.add(rideGroup);
  rideGroup.position.set(0, -rideNow.seat, 0);
  rideGroup.rotation.y = 0;

function parkVehicle() {
  parked = true;
  scene.add(rideGroup);
  rideGroup.position.set(player.pos.x, 0, player.pos.z);
  rideGroup.rotation.y = body.rotation.y;

}

// Mouse drag anywhere, or touch drag on the right half (the left half is covered by #leftZone).
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  if (lookId !== null) return;
  lookId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== lookId) return;
  const s = e.pointerType === 'touch' ? .008 : .005;
  yaw -= (e.clientX - lastX) * s;
  pitch = clamp(pitch + (e.clientY - lastY) * s * .8, .12, 1.15);
  lastX = e.clientX; lastY = e.clientY;
});

// The joystick appears wherever the thumb lands in the left zone.
const zone = $('leftZone'), base = $('base'), knob = $('knob'), STICK_R = 50;

const moveStick = e => {
  let dx = e.clientX - originX, dy = e.clientY - originY;
  const d = Math.hypot(dx, dy);
  if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
  stick.x = dx / STICK_R;
  stick.y = dy / STICK_R;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
};
zone.addEventListener('pointerdown', e => {
  if (stick.id !== null) return;
  stick.id = e.pointerId;
  zone.setPointerCapture(e.pointerId);
  originX = e.clientX; originY = e.clientY;
  base.style.left = originX + 'px';
  base.style.top = originY + 'px';
  moveStick(e);
});
zone.addEventListener('pointermove', e => { if (e.pointerId === stick.id) moveStick(e); });
const endStick = e => {
  if (e.pointerId !== stick.id) return;
  stick.id = null; stick.x = stick.y = 0;
  restStick();
};
zone.addEventListener('pointerup', endStick);
zone.addEventListener('pointercancel', endStick);

function holdButton(el, down, up) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add('down');
    down();
  });
  const release = () => { el.classList.remove('down'); up?.(); };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
}
holdButton($('btnJump'), () => wantJump = true);
holdButton($('btnSprint'), () => sprintHeld = true, () => sprintHeld = false);
holdButton($('btnAction'), action);

// ---------- Update ----------
function movePlayer(dt) {
  const p = player;
  p.stun -= dt;

  let ix = stick.x, iz = -stick.y;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  const mag = Math.hypot(ix, iz);
  if (mag > 1) { ix /= mag; iz /= mag; }
  if (p.stun > 0) ix = iz = 0;

  // Customer yards are on foot: that's where the dogs are.
  const inCustomerYard = HOUSES.some(h => inYard(p.pos, h.yard));
  if (save.equipped && inCustomerYard !== parked) inCustomerYard ? parkVehicle() : mountVehicle();
  const ride = parked ? null : rideNow;

  const moving = Math.hypot(ix, iz) > .05;
  const sprinting = !ride && (keys.ShiftLeft || keys.ShiftRight || sprintHeld) && moving && p.stamina > 0;
  p.stamina = clamp(p.stamina + (sprinting ? -30 : 18) * dt, 0, 100);
  if (myLot() && nearSpot(myLot().step, 3.6)) p.stamina = Math.min(100, p.stamina + 60 * dt);
  const speed = (ride ? ride.speed : sprinting ? SPRINT : RUN) * (orders.some(o => !o.food) ? PARCEL_SLOW : 1);

  // On a phone the left thumb also steers the camera a little, so you can play one-handed.
  if (stick.id !== null && lookId === null) yaw -= ix * 1.1 * dt;

  const s = Math.sin(yaw), c = Math.cos(yaw), grip = Math.min(1, (ride ? ride.accel : 30) * dt);
  p.vx += ((-s * iz + c * ix) * speed - p.vx) * grip;
  p.vz += ((-c * iz - s * ix) * speed - p.vz) * grip;
  const pace = Math.hypot(p.vx, p.vz);

  // Riding forward, the camera swings round behind you, so steering is just pushing sideways.
  if (ride && iz > .2 && pace > 2 && lookId === null) {
    const want = Math.atan2(p.vx, p.vz) + Math.PI;
    yaw += Math.atan2(Math.sin(want - yaw), Math.cos(want - yaw)) * Math.min(1, 1.8 * dt);
  }

  // Small steps, so a fast vehicle at a low frame rate can't skip through a fence.
  const steps = Math.ceil((pace + Math.hypot(p.kx, p.kz)) * dt / .3) || 1;
  for (let i = 0; i < steps; i++) {
    p.pos.x += (p.vx + p.kx) * dt / steps;
    p.pos.z += (p.vz + p.kz) * dt / steps;
    resolve(p.pos, PLAYER_R);
  }
  const fade = Math.exp(-6 * dt);
  p.kx *= fade;
  p.kz *= fade;
  p.pos.x = clamp(p.pos.x, -EDGE + 1, EDGE - 1);
  p.pos.z = clamp(p.pos.z, -EDGE + 1, EDGE - 1);

  const grounded = p.pos.y <= 0;
  if (wantJump && grounded && p.stun <= 0) p.vy = JUMP_V;
  wantJump = false;
  p.vy -= GRAVITY * dt;
  p.pos.y += p.vy * dt;
  if (p.pos.y < 0) { p.pos.y = 0; p.vy = 0; }

  if (ride ? pace > 1 : moving) body.rotation.y = Math.atan2(p.vx, p.vz);
  p.moving += ((moving ? 1 : 0) - p.moving) * Math.min(1, 12 * dt);
  p.phase += speed * dt * 1.7;
  const seated = ride && ride.seat > .5, swing = ride ? 0 : Math.sin(p.phase) * .9 * p.moving;
  legL.rotation.x = seated ? -1.25 : swing;
  legR.rotation.x = seated ? -1.25 : -swing;
  const reach = orders.length || seated;
  armL.rotation.x = reach ? -1.5 : -swing;
  armR.rotation.x = reach ? -1.5 : swing;
  body.position.copy(p.pos);
  if (ride) body.position.y += ride.seat;
  blob.position.set(p.pos.x, .17, p.pos.z);

  // Snapped to whole shadow texels, or shadow edges crawl as you move.
  const texel = 120 / 2048, sx = Math.round(p.pos.x / texel) * texel, sz = Math.round(p.pos.z / texel) * texel;
  sun.target.position.set(sx, 0, sz);
  sun.position.set(sx, 0, sz).addScaledVector(sunDir, 120);
}

let shake = 0;
const ray = new THREE.Raycaster(), camDir = new THREE.Vector3(), focus = new THREE.Vector3();
function updateCamera(dt) {
  focus.copy(player.pos);
  focus.y += 2;
  camDir.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  // Pull the camera in when a building gets between it and the player.
  ray.set(focus, camDir);
  ray.far = 10;
  const hit = ray.intersectObjects(solids, false)[0];
  camera.position.copy(focus).addScaledVector(camDir, hit ? Math.max(1.5, hit.distance - .4) : 10);
  if (shake > 0) {
    shake -= dt;
    camera.position.x += (Math.random() - .5) * shake * 2;
    camera.position.y += (Math.random() - .5) * shake * 2;
  }
  camera.lookAt(focus);
}

let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function updateHud(now) {
  $('cash').textContent = `₱${save.cash}`;
  $('staminaBar').firstElementChild.style.transform = `scaleX(${player.stamina / 100})`;
  $('job').style.visibility = orders.length ? 'visible' : 'hidden';
  const spot = actionSpot();
  $('btnAction').classList.toggle('ready', !!spot);
  $('btnAction').textContent = spot || 'ACTION';
  hubRing.scale.setScalar(1 + Math.sin(now / 250) * .04);
  beamMaterial.opacity = .28 + Math.sin(now / 200) * .1;
  const press = isTouch ? 'Tap' : 'Press E:', deal = affordable();
  $('hint').textContent =
    spot === 'ORDER' ? `${press} take an order${orders.length ? ` (${orders.length} of ${capacity()} carried)` : ''}` :
    spot === 'HOME' ? `${press} open your home` :
    orders.length ? '' :
    !save.delivered ? (isTouch ? 'Left thumb moves, right thumb looks. Follow the green dot for orders' : 'WASD move · Shift sprint · Space jump · drag to look · follow the green dot for orders') :
    deal ? `You can afford: ${deal.name}. Follow the blue dot home` : '';
  const o = nearestOrder();
  if (!o) return;
  const d = o.house.step, dx = d.x - player.pos.x, dz = d.z - player.pos.z;
  const s = Math.sin(yaw), c = Math.cos(yaw);
  const ahead = dx * -s + dz * -c, right = dx * c + dz * -s;
  $('arrow').style.transform = `rotate(${Math.atan2(right, ahead)}rad)`;
  $('dist').textContent = `${Math.round(Math.hypot(dx, dz))}m`;
  $('orderName').textContent = `${o.food ? 'Food' : 'Parcel'} to ${o.house.name} house`;
  $('freshLabel').textContent = o.food ? 'Freshness' : 'Condition';
  $('timeLeft').textContent = `${Math.ceil(o.left)}s`;
  $('timeBar').firstElementChild.style.transform = `scaleX(${o.left / o.max})`;
  $('freshBar').firstElementChild.style.transform = `scaleX(${o.fresh / 100})`;
  $('more').textContent = orders.filter(x => x !== o).map(x => `+ ${x.house.name} ${Math.ceil(x.left)}s`).join('  ');
}

// ---------- Minimap ----------
const mini = $('mini'), mx = mini.getContext('2d');
const MINI_RANGE = 90, MAP_PX = 2; // Metres from centre to rim; pixels per metre in the prerendered map.
const hex = c => '#' + c.toString(16).padStart(6, '0');

// The map only changes when the world does, so it's drawn once and rotated each frame.
const mapLayer = document.createElement('canvas');
function drawMapLayer() {
  mapLayer.width = mapLayer.height = EDGE * 2 * MAP_PX;
  const x = mapLayer.getContext('2d');
  x.scale(MAP_PX, MAP_PX);
  x.translate(EDGE, EDGE);
  x.fillStyle = '#7dc777';
  x.fillRect(-EDGE, -EDGE, EDGE * 2, EDGE * 2);
  x.fillStyle = '#3e8c4a';
  for (const [tx, tz] of TREES) x.fillRect(tx - 1.5, tz - 1.5, 3, 3);
  x.fillStyle = '#5a5f6a';
  for (const [w, d, rx, rz] of ROADS) x.fillRect(rx - w / 2, rz - d / 2, w, d);
  x.fillStyle = '#cfd3da';
  x.beginPath();
  x.arc(0, 0, 15, 0, Math.PI * 2);
  x.fill();
  for (const h of HOUSES) {
    const y = h.yard;
    x.fillStyle = h.dog ? '#d9866b' : '#a6dd9f';
    x.fillRect(y.x0, y.z0, y.x1 - y.x0, y.z1 - y.z0);
  }
  x.fillStyle = '#b98a56';
  for (const l of LOTS) x.fillRect(l.x - 6, l.z - 6, 12, 12);
  for (const w of walls) {
    x.fillStyle = hex(w.color);
    x.fillRect(w.x - w.w / 2, w.z - w.d / 2, w.w, w.d);
  }
}
drawMapLayer();

function sizeMini() {
  mini.width = mini.height = Math.round(mini.clientWidth * Math.min(devicePixelRatio, 2));
}
addEventListener('resize', sizeMini);
sizeMini();

function updateMini(now) {
  const size = mini.width, r = size / 2, k = r / MINI_RANGE, p = player.pos;
  const s = Math.sin(yaw), c = Math.cos(yaw), dot = size / 60;
  // World to screen, turned so the way the camera faces is always up. Markers pin to the rim.
  const toMini = (x, z, pin) => {
    const dx = x - p.x, dz = z - p.z;
    let sx = (dx * c - dz * s) * k, sy = (dx * s + dz * c) * k;
    const d = Math.hypot(sx, sy), max = r - dot * 2.5;
    if (pin && d > max) { sx *= max / d; sy *= max / d; }
    return [r + sx, r + sy];
  };

  mx.save();
  mx.clearRect(0, 0, size, size);
  mx.beginPath();
  mx.arc(r, r, r, 0, Math.PI * 2);
  mx.clip();
  mx.fillStyle = '#3e8c4a';
  mx.fillRect(0, 0, size, size);
  mx.save();
  mx.translate(r, r);
  mx.rotate(yaw);
  mx.scale(k, k);
  mx.translate(-p.x, -p.z);
  mx.drawImage(mapLayer, -EDGE, -EDGE, EDGE * 2, EDGE * 2);
  mx.restore();

  const marker = (x, y, radius, fill) => {
    mx.beginPath();
    mx.arc(x, y, radius, 0, Math.PI * 2);
    mx.fillStyle = fill;
    mx.fill();
    mx.strokeStyle = '#fff';
    mx.lineWidth = size / 110;
    mx.stroke();
  };
  for (const d of dogs) marker(...toMini(d.pos.x, d.pos.z), dot * (.4 + d.scale * .4), '#e0352b');
  if (myLot()) marker(...toMini(myLot().x, myLot().z, true), dot * 1.5, '#2f7de0');
  if (orders.length < capacity()) marker(...toMini(HUB.x, HUB.z, true), dot * 1.4, '#35d873');
  const first = nearestOrder();
  for (const o of orders) {
    const t = o.house.step;
    marker(...toMini(t.x, t.z, true), o === first ? dot * (1.6 + Math.sin(now / 160) * .35) : dot * 1.2, '#ffd23f');
  }

  // Player arrow, pointing the way the character faces.
  mx.translate(r, r);
  mx.rotate(Math.PI - body.rotation.y + yaw);
  mx.beginPath();
  mx.moveTo(0, -dot * 2.4);
  mx.lineTo(dot * 1.7, dot * 1.8);
  mx.lineTo(0, dot * .8);
  mx.lineTo(-dot * 1.7, dot * 1.8);
  mx.closePath();
  mx.fillStyle = '#2f7de0';
  mx.fill();
  mx.strokeStyle = '#fff';
  mx.lineWidth = size / 90;
  mx.stroke();
  mx.restore();

  // North marker on the rim, so the turning map stays readable.
  const nx = r + s * (r - dot * 2), ny = r - c * (r - dot * 2);
  mx.font = `bold ${dot * 2.2}px system-ui, sans-serif`;
  mx.textAlign = 'center';
  mx.textBaseline = 'middle';
  mx.lineWidth = size / 90;
  mx.strokeStyle = 'rgba(0,0,0,.65)';
  mx.strokeText('N', nx, ny);
  mx.fillStyle = '#fff';
  mx.fillText('N', nx, ny);
}

// Back home if there's a home to come back to. First timers get a name prompt, then a box.
setVehicle(save.equipped);
if (myLot()) {
  showHome();
  goHome();
} else {
  claimBox.showModal();
}

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  movePlayer(dt);
  dogs.forEach(d => updateDog(d, dt));
  updateOrder(dt);
  updateCamera(dt);
  updateDay(dt);
  updateHud(now);
  updateMini(now);
  renderer.render(scene, camera);
});

// Handle for scripted checks from the console.
window.game = {
  player, dogs, HOUSES, takeOrder, renderer, walls, blocks,
  get dayTime() { return dayTime; }, set dayTime(v) { dayTime = v; },
  LOTS, HOMES, VEHICLES, DOG_TYPES, orders, save, action, actionSpot, capacity, rideStats,
  buyVehicle, buyPart, buyHome, setVehicle, claimLot, showHome, get order() { return orders[0]; }, get cash() { return save.cash; }, get delivered() { return save.delivered; },
  get parked() { return parked; },
  get yaw() { return yaw; }, set yaw(v) { yaw = v; },
};
</script>
</body>
</html>
